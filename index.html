<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>實體課務管理系統</title>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgMjAwIj4KICA8cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iI2U4ZWVmYyIvPgogIDx0ZXh0IHg9IjIwMCIgeT0iMTE1IiBmb250LXNpemU9IjY0IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj7wn5OaPC90ZXh0Pgo8L3N2Zz4K" type="image/svg+xml">
  <style>
:root {
  --bg: #f4f6fb;
  --card: #fff;
  --text: #1e293b;
  --muted: #64748b;
  --line: #e3e8f0;
  --primary: #4a5bd4;
  --primary-soft: #eceffd;
  --danger: #d6564f;
  --ok: #3a9a6b;
  --warn: #d9822b;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(30, 41, 59, .05), 0 4px 14px rgba(30, 41, 59, .05);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  line-height: 1.6;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 24px;
  position: sticky;
  top: 0;
  z-index: 5;
  box-shadow: 0 1px 8px rgba(30, 41, 59, .06);
}
.topbar h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
nav a {
  padding: 6px 14px;
  border-radius: 999px;
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
}
nav a { transition: background .15s, color .15s; }
nav a:hover { background: var(--primary-soft); color: var(--primary); }
nav a.active { background: var(--primary); color: #fff; font-weight: 600; box-shadow: 0 2px 8px rgba(74, 91, 212, .35); }

main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
h2 { margin: 0 0 16px; font-size: 20px; }
h3 { margin: 0 0 8px; font-size: 16px; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
.head h2 { margin: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat .num { font-size: 24px; font-weight: 700; color: var(--primary); white-space: nowrap; }
.stat .lbl { color: var(--muted); font-size: 13px; }
.stat { position: relative; overflow: hidden; padding-left: 20px; }
.stat::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c, var(--primary)); }
.stat:nth-child(1) { --c: #4a5bd4; } .stat:nth-child(2) { --c: #2f8fa8; } .stat:nth-child(3) { --c: #e8913a; }
.stat:nth-child(4) { --c: #3a9a6b; } .stat:nth-child(5) { --c: #7c6fd6; } .stat:nth-child(6) { --c: #94a3b8; }
.stat:nth-child(5) .num { color: #7c6fd6; } .stat:nth-child(6) .num { color: #64748b; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.course { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.course img { width: 100%; height: 150px; object-fit: cover; display: block; background: var(--primary-soft); }
.course .body { padding: 14px 16px; flex: 1; }
.course .desc { color: var(--muted); font-size: 14px; margin: 4px 0 8px; }
.course .foot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; }

table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; font-size: 14px; box-shadow: var(--shadow); }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { background: #f1f4fa; font-weight: 600; color: var(--muted); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr:hover td { background: #fafbff; }
th:hover { background: #f1f4fa; }
.table-wrap { overflow-x: auto; }
.empty { text-align: center; color: var(--muted); padding: 32px; }

.tag { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 12px; background: var(--primary-soft); color: var(--primary); }
.tag.ok { background: #e4f4ec; color: #2c7d55; }
.tag.warn { background: #fdf0e0; color: #b8691a; }
.tag.gray { background: #eef1f5; color: #64748b; }
.tag.danger { background: #fde9e7; color: #bd453f; }
.muted { color: var(--muted); font-size: 13px; }

.bar { position: relative; width: 90px; height: 6px; background: var(--line); border-radius: 3px; display: inline-block; vertical-align: middle; margin-left: 6px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #7d8cf0, var(--primary)); border-radius: 3px; }
.bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #d6564f; text-decoration: none; }

button, .btn {
  font: inherit;
  font-size: 13px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  cursor: pointer;
  color: var(--text);
  transition: background .15s, box-shadow .15s;
}
button:hover { background: #f1f4fa; }
button.primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(74, 91, 212, .3); }
button.primary:hover { background: #3b4bbf; }
button.danger { color: #bd453f; border-color: #f2c4c0; }
button.danger:hover { background: #fdf0ef; }
button.sm { padding: 3px 9px; font-size: 12px; }

input, select, textarea {
  font: inherit;
  font-size: 14px;
  padding: 7px 10px;
  border: 1px solid #d3dae6;
  border-radius: 8px;
  background: #fff;
  width: 100%;
}
.toolbar input, .toolbar select { width: auto; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }

dialog {
  border: 0;
  border-radius: 18px;
  padding: 0;
  width: min(520px, calc(100vw - 24px));
  box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
}
dialog::backdrop { background: rgba(0, 0, 0, .4); }
dialog form { padding: 22px; max-height: 88vh; overflow-y: auto; }
dialog h2 { margin-bottom: 14px; }
dialog label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
dialog label input, dialog label select, dialog label textarea { margin-top: 4px; color: var(--text); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.info {
  background: var(--primary-soft);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  margin-bottom: 12px;
  color: var(--text);
}
.info b { color: var(--primary); }

.rule-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.rule-row input { width: 90px; }
.section { margin-bottom: 28px; }

@media (max-width: 600px) {
  .row2 { grid-template-columns: 1fr; }
  .topbar { padding: 10px 12px; }
}

/* ---------- 時程儀表板 ---------- */
.section > h3 { font-size: 17px; margin-bottom: 10px; }
.section > h3 .muted { font-weight: 400; margin-left: 6px; }

.pill-tag { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; color: #fff; }
.legend .pill-tag { width: 14px; height: 14px; padding: 0; vertical-align: -2px; margin-right: 4px; border-radius: 4px; }
.pill-tag.full, .pill.full { background: #2f8fa8; }
.pill-tag.formed, .pill.formed { background: #3a9a6b; }
.pill-tag.unformed, .pill.unformed { background: #e8913a; }
.pill-tag.risk, .pill.risk { background: #d6564f; }
.pill-tag.past, .pill.past { background: #aab2bd; }
.pill-tag.off { background: #fff; border: 1px dashed #adb5bd; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }

.tag.live { background: #e4f4ec; color: #2c7d55; font-weight: 600; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .45; } }

.now-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.now { cursor: pointer; transition: box-shadow .15s; }
.now:hover, .sum-line:hover { box-shadow: 0 4px 16px rgba(30, 41, 59, .12); }
.now.today { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
.now .top { display: flex; justify-content: space-between; margin-bottom: 6px; }
.now h3 { margin-bottom: 2px; }
.fill { margin-top: 8px; font-size: 14px; }
.fill.big { margin: 8px 0 6px; }

.sum-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.sum-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; padding: 6px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; }
.sum-line:hover { background: #f1f4fa; box-shadow: none; }

/* ---------- 多上課日／成班 ---------- */
.dates { display: flex; flex-wrap: wrap; gap: 3px; max-width: 230px; }
.dchip { font-size: 12px; padding: 0 7px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); }
.dchip.off { background: #f1f3f5; color: #868e96; text-decoration: line-through; }
.alert-row { box-shadow: var(--shadow); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 14px; margin-bottom: 8px; border-radius: var(--radius); background: #fff6ea; border: 1px solid #f7dcb7; cursor: pointer; font-size: 14px; }
.alert-row.risk { background: #fff1f0; border-color: #f6cdc9; }
.alert-row .pill-tag { margin-left: auto; }
.date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.date-row .dt { flex: 1; }
dialog label.chk { display: flex; align-items: center; gap: 4px; margin: 0; white-space: nowrap; }
dialog label.chk input { width: auto; margin: 0; }
.gen { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 14px; font-size: 13px; }
.gen input { width: auto; }

/* ---------- 月曆 ---------- */
.cal-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.cal-head b { font-size: 16px; min-width: 110px; text-align: center; }
.cal-scroll { overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); min-width: 770px; }
.cal-wd { text-align: center; padding: 8px 0; font-size: 13px; font-weight: 600; color: var(--muted); background: #f1f4fa; border-bottom: 1px solid var(--line); }
.cal-cell { min-height: 96px; padding: 4px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cal-cell:nth-child(7n+7) { border-right: 0; }
.cal-cell.other { background: #f8f9fc; }
.cal-cell.other .cal-day { color: #ced4da; }
.cal-cell.today { background: #f0f2fe; }
.cal-cell.today .cal-day { background: var(--primary); color: #fff; }
.cal-day { display: inline-block; min-width: 22px; padding: 0 5px; margin-bottom: 3px; border-radius: 11px; font-size: 12px; text-align: center; color: var(--muted); }
/* 每個課程一個柔和色（由 --bg / --bd / --tx 指定），狀態用右上角圓點 */
.cal-item { position: relative; margin-bottom: 3px; padding: 3px 14px 3px 7px; border-radius: 8px; font-size: 12px; line-height: 1.35; cursor: pointer; background: var(--bg); color: var(--tx); border-left: 4px solid var(--bd); }
.cal-item span { font-size: 11px; opacity: .85; }
.cal-item:hover { filter: brightness(.97); box-shadow: 0 2px 6px rgba(30, 41, 59, .14); }
.cal-item.past { opacity: .55; }
.cal-item.off { background: #fff; border: 1px dashed var(--bd); border-left: 4px dashed var(--bd); color: #868e96; }
.sdot { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: #adb5bd; }
.sdot.full { background: #2f8fa8; } .sdot.formed { background: #3a9a6b; } .sdot.unformed { background: #e8913a; } .sdot.risk { background: #d6564f; } .sdot.past { background: #aab2bd; }
.legend .sdot { position: static; display: inline-block; margin-right: 4px; vertical-align: 0; }
.swatch { display: inline-block; width: 14px; height: 14px; border-radius: 4px; background: var(--bg); border-left: 4px solid var(--bd); margin-right: 5px; vertical-align: -2px; }

/* ---------- 匯入訂單 ---------- */
.imp-cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.imp-cols label, .unm select { font-size: 13px; color: var(--muted); }
.imp-cols select, .imp-cols input { display: block; margin-top: 3px; }
.unm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.unm:last-of-type { margin-bottom: 12px; }
.imp-sum { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.info-done { background: #e4f4ec; border-color: #b7dfca; }
@media (max-width: 600px) { .unm { grid-template-columns: 1fr; } }

/* ---------- 登入與同步狀態 ---------- */
.sync { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text); flex-wrap: wrap; }
.sdot-lg { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.login { max-width: 380px; margin: 60px auto; }
.login h2 { margin-bottom: 16px; }
.login label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.login label input { margin-top: 4px; color: var(--text); }
.login-msg { color: var(--danger); font-size: 13px; margin: 0 0 10px; }

</style>
</head>
<body>
  <header class="topbar">
    <h1>📚 實體課務管理系統</h1>
    <nav id="nav">
      <a href="#dashboard" data-view="dashboard">總覽</a>
      <a href="#courses" data-view="courses">課程</a>
      <a href="#sessions" data-view="sessions">場次</a>
      <a href="#registrations" data-view="registrations">報名名單</a>
      <a href="#import" data-view="import">匯入訂單</a>
      <a href="#logs" data-view="logs">異動紀錄</a>
      <a href="#settings" data-view="settings">設定</a>
    </nav>
    <div class="sync" id="sync"></div>
  </header>

  <main id="view"></main>

  <dialog id="modal"></dialog>

  <!-- SheetJS：讓瀏覽器能讀 Excel(.xlsx)，只用在「匯入訂單」 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Supabase：雲端資料庫與登入，讓多台設備同步 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
/*
 * 雲端同步設定（Supabase）
 * 這裡的 key 是「可公開」的 publishable key，設計上就是放在網頁裡；
 * 真正的保護來自資料庫的權限規則 + 登入，沒有登入的人讀不到也寫不進資料。
 * 若要改回「只存本機」，把 url 清空即可。
 */
const SUPABASE_CONFIG = {
  url: 'https://akrgrgqkdnbkqvzitkju.supabase.co',
  key: 'sb_publishable_c28-95dfcGedta63a1i5lA_qGlYxN2f'
};

/*
 * 資料儲存層
 * 目前存在瀏覽器 localStorage。之後要改接線上資料庫（例如 Google Sheets、Firebase、Supabase），
 * 只要改寫這個檔案的 load / save，app.js 不用動。
 */
const Store = {
  KEY: 'course-admin-v1',

  /* ---------- 儲存層：有設定 Supabase 就用雲端（多台設備同步），否則存在本機瀏覽器 ---------- */
  mode: 'local',
  client: null,
  version: 0,
  email: '',
  onStatus: () => {},
  CACHE_KEY: 'course-admin-cloud-cache',
  _timer: null, _saving: false, _dirty: false, _pending: null, _conflict: false,

  cloudConfigured() {
    return typeof SUPABASE_CONFIG !== 'undefined' && !!SUPABASE_CONFIG.url && typeof supabase !== 'undefined';
  },

  // 啟動：回傳 { data } 或 { needLogin } 或 { notMember }
  async init() {
    if (!this.cloudConfigured()) { this.mode = 'local'; return { data: this.loadLocal() }; }
    this.mode = 'cloud';
    this.client = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key);
    const { data: { session } } = await this.client.auth.getSession();
    if (!session) return { needLogin: true };
    return this.afterLogin(session);
  },
  async login(email, password) {
    const { data, error } = await this.client.auth.signInWithPassword({ email, password });
    if (error) throw error;
    return this.afterLogin(data.session);
  },
  async logout() { await this.client.auth.signOut(); },
  async afterLogin(session) {
    this.email = session.user.email;
    const { data: ok, error } = await this.client.rpc('is_member');
    if (error) throw error;
    if (!ok) return { notMember: true };
    return { data: await this.pull(true) };
  },

  // 從雲端讀整份資料；雲端還沒有資料時，用這個瀏覽器原有的資料（沒有就用預設課程）上傳
  async pull(createIfMissing) {
    const { data: row, error } = await this.client.from('app_state').select('data,version').eq('id', 1).maybeSingle();
    if (error) throw error;
    if (row) { this.version = row.version; this._cache(row.data); return this.migrate(row.data); }
    if (!createIfMissing) throw new Error('雲端找不到資料');
    const seed = this.loadLocal();
    const { error: e2 } = await this.client.from('app_state').insert({ id: 1, data: seed, version: 1, updated_by: this.email });
    if (e2) return this.pull(false);   // 另一台剛好先建立了
    this.version = 1;
    return seed;
  },

  // 儲存：本機直接寫；雲端稍等 0.5 秒合併多次修改再送出，並檢查版本避免蓋掉別台的修改
  save(data) {
    if (this.mode !== 'cloud') { localStorage.setItem(this.KEY, JSON.stringify(data)); return; }
    if (this._conflict) return;
    this._pending = data;
    this.onStatus('saving');
    clearTimeout(this._timer);
    this._timer = setTimeout(() => this._flush(), 500);
  },
  hasPending() { return this.mode === 'cloud' && !!(this._pending || this._saving); },
  async _flush() {
    if (this._saving) { this._dirty = true; return; }
    const data = this._pending;
    if (!data) return;
    this._saving = true; this._pending = null;
    try {
      const { data: rows, error } = await this.client.from('app_state')
        .update({ data, version: this.version + 1, updated_at: new Date().toISOString(), updated_by: this.email })
        .eq('id', 1).eq('version', this.version).select('version');
      if (error) throw error;
      if (!rows.length) { this._conflict = true; this.onStatus('conflict'); return; }
      this.version = rows[0].version;
      this._cache(data);
      this.onStatus('saved');
    } catch (e) {
      if (!this._pending) this._pending = data;
      this.onStatus('error', e.message);
      clearTimeout(this._timer);
      this._timer = setTimeout(() => this._flush(), 5000);   // 失敗 5 秒後自動重試
    } finally {
      this._saving = false;
      if (this._dirty) { this._dirty = false; this._flush(); }
    }
  },
  // 檢查雲端有沒有比較新的版本（別台改過）；有的話回傳最新資料
  async refresh() {
    if (this.mode !== 'cloud' || this._pending || this._saving || this._conflict) return null;
    const { data: row } = await this.client.from('app_state').select('version').eq('id', 1).maybeSingle();
    if (row && row.version > this.version) return this.pull(false);
    return null;
  },
  _cache(data) { try { localStorage.setItem(this.CACHE_KEY, JSON.stringify(data)); } catch (e) { /* 備份失敗不影響使用 */ } },

  loadLocal() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) return this.migrate(JSON.parse(raw));
    } catch (e) {
      console.warn('讀取資料失敗，改用預設資料', e);
    }
    const data = this.initial();
    localStorage.setItem(this.KEY, JSON.stringify(data));
    return data;
  },

  // 舊版資料升級：單一日期 → 多個上課日；補上成班人數等新欄位
  migrate(d) {
    d.logs = d.logs || [];
    d.settings = d.settings || { refundRules: this.defaultRules() };
    d.settings.ignoredProducts = d.settings.ignoredProducts || [];
    d.sessions.forEach(s => {
      if (!s.dates) { s.dates = s.date ? [{ date: s.date, off: false }] : []; delete s.date; }
      if (s.minEnroll == null) s.minEnroll = 1;
      s.name = s.name || '';
      s.productName = s.productName || '';

  // 預設退費規則：開課前至少 N 天 → 退 X%（由大到小比對，符合的第一條生效）
  defaultRules() {

    ];

  // 「休」= 該日不上課（不算堂數）
  dates(list) {

  // 範例資料（含假學員），用來看儀表板各種狀態的樣子
  sample() {

/* 實體課務管理系統：主程式 */
let db = Store.empty();          // 啟動後由 boot() 載入（本機或雲端）
let appState = 'loading';        // loading | login | denied | error | ready
let authMsg = '';
function ymdMonth(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
const ui = { sessionCourse: '', regSession: '', regStatus: '', regQ: '', calMonth: ymdMonth() };

/* ---------- 小工具 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const money = n => 'NT$ ' + Number(n || 0).toLocaleString();
const commit = () => Store.save(db);
const byId = (arr, id) => arr.find(x => x.id === id);
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const shortDate = s => `${+s.slice(5, 7)}/${+s.slice(8)}`;

function fmtDate(s) {
  const d = new Date(s + 'T00:00');
  return `${s}（${WEEK[d.getDay()]}）`;
}
// 距離某天還有幾天（今天 = 0，已過為負數）
function daysUntil(dateStr) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((new Date(dateStr + 'T00:00') - today) / 86400000);
}
function log(type, text) {
  db.logs.unshift({ id: uid('l'), at: new Date().toISOString(), type, text });
}

/* ---------- 場次：上課日、狀態 ---------- */
const classDates = s => (s.dates || []).filter(d => !d.off).map(d => d.date).sort(); // 實際上課的日子（不含休）
const startDate = s => classDates(s)[0] || '';
const endDate = s => classDates(s).slice(-1)[0] || '';
const courseName = id => byId(db.courses, id)?.name || '（課程已刪除）';
const sessionTitle = s => courseName(s.courseId) + (s.name ? '｜' + s.name : '');
const sessionLabel = s => `${sessionTitle(s)}｜${shortDate(startDate(s))} 起${s.location ? '｜' + s.location : ''}`;
const sortSessions = arr => [...arr].sort((a, b) => startDate(a).localeCompare(startDate(b)));
const activeRegs = sid => db.registrations.filter(r => r.sessionId === sid && r.status === 'active');
const seatsLeft = s => s.capacity - activeRegs(s.id).length;
const hasStarted = s => daysUntil(startDate(s)) < 0;   // 第一堂已經過了
const hasEnded = s => daysUntil(endDate(s)) < 0;

function startTime(s, base = new Date()) {
  const [h, m] = (s.time || '00:00').split(':');
  const t = new Date(base); t.setHours(+h, +m, 0, 0);
  return t;
}
function endTime(s) {
  const t = new Date(startTime(s).getTime() + (s.duration || 3) * 3600000);
  return `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
}
// 今天有課時：尚未開始／進行中／已結束
function todayState(s) {
  const start = startTime(s), end = new Date(start.getTime() + (s.duration || 3) * 3600000), now = new Date();
  return now < start ? 'wait' : now <= end ? 'live' : 'done';
}
// 還缺哪些資料，提醒你補上
function missingInfo(s) {
  const m = [];
  if (!s.time) m.push('上課時間');
  if (!s.location) m.push('地點');
  if (s.price == null) m.push('價格');
  if (!s.productName) m.push('平台商品名稱');
  return m;
}

// 招生狀態：額滿／已成班／未成班（快到決定日會升級為警示）
function fillInfo(s) {
  const n = activeRegs(s.id).length, min = s.minEnroll || 1, cap = s.capacity;
  const base = { n, min, cap, need: Math.max(0, min - n) };
  if (hasEnded(s)) return { ...base, cls: 'past', label: '已結束' };
  if (n >= cap) return { ...base, cls: 'full', label: '額滿' };
  if (n >= min) return { ...base, cls: 'formed', label: '已成班' };
  const deadline = s.decideBy || startDate(s);
  const left = daysUntil(deadline);
  if (left <= 3) return { ...base, cls: 'risk', label: `未成班・差 ${base.need} 人・${left < 0 ? '已逾期' : left === 0 ? '今天截止' : left + ' 天後截止'}` };
  return { ...base, cls: 'unformed', label: `未成班・差 ${base.need} 人` };
}
const statusTag = f => `<span class="pill-tag ${f.cls}">${esc(f.label)}</span>`;
// 進度條：紅線是成班人數的位置
const fillBar = (n, min, cap) => `<span class="bar"><i style="width:${cap ? Math.min(100, n / cap * 100) : 0}%"></i><u style="left:${cap ? Math.min(100, min / cap * 100) : 0}%"></u></span>`;

function datesChips(s) {
  const total = classDates(s).length;
  return `<div class="dates">${(s.dates || []).slice().sort((a, b) => a.date.localeCompare(b.date))
    .map(d => `<span class="dchip ${d.off ? 'off' : ''}" title="${fmtDate(d.date)}${d.off ? ' 休課' : ''}">${shortDate(d.date)}${d.off ? ' 休' : ''}</span>`).join('')}</div>
    <div class="muted">共 ${total} 堂</div>`;
}

// 依退費規則算出比例（以第一堂課的日期計算）
function refundPercent(days) {
  if (days < 0) return 0;
  const rules = [...db.settings.refundRules].sort((a, b) => b.minDays - a.minDays);
  const hit = rules.find(r => days >= r.minDays);
  return hit ? hit.percent : 0;
}

const modal = $('#modal');
function openModal(title, html, onSubmit, submitText = '儲存') {

    <div class="actions"><button type="button" data-cancel>取消</button><button class="primary">${esc(submitText)}</button></div></form>`;
  const form = $('form', modal);

    e.preventDefault();

  };

  return form;
}
const field = (label, name, val = '', attrs = '') => `<label>${label}<input name="${name}" value="${esc(val)}" ${attrs}></label>`;

// 需要關注：還沒成班的場次
function viewAlerts() {
  const list = db.sessions.map(s => ({ s, f: fillInfo(s) })).filter(x => x.f.cls === 'unformed' || x.f.cls === 'risk')
    .sort((a, b) => (a.s.decideBy || startDate(a.s)).localeCompare(b.s.decideBy || startDate(b.s)));
  const rows = list.map(({ s, f }) => {

      <span class="muted">${s.decideBy ? '成班決定日' : '開課日'} ${shortDate(dl)}（${daysUntil(dl) < 0 ? '已過 ' + -daysUntil(dl) : '還有 ' + daysUntil(dl)} 天）</span>
      ${statusTag(f)}</div>`;
  }).join('');
  return `<div class="section"><h3>成班提醒 <span class="muted">還沒達到成班人數的場次</span></h3>
    ${rows || '<div class="card empty">目前沒有需要關注的場次 ✓</div>'}</div>`;
}

function viewNow() {
  const today = ymd(new Date());
  const rel = sortSessions(db.sessions.filter(s => !hasEnded(s) && daysUntil(startDate(s)) <= 7));
  const card = s => {
    const a = daysUntil(startDate(s)), f = fillInfo(s), cds = classDates(s);
    const total = cds.length, done = cds.filter(d => d <= today).length;
    let when;
    if (cds.includes(today)) {
      const st = todayState(s);
      when = st === 'live' ? '<span class="tag live">● 進行中</span>' : st === 'wait' ? `<span class="tag warn">今天${s.time ? ' ' + esc(s.time) : ''}上課</span>` : '<span class="tag gray">今日課程已結束</span>';
      when += ` <span class="muted">第 ${done}/${total} 堂</span>`;
    } else if (a <= 0) {
      const next = cds.find(d => d > today);
      when = `<span class="tag">上課中</span> <span class="muted">已上 ${done}/${total} 堂，下堂 ${next ? shortDate(next) : '—'}</span>`;
    } else when = `<span class="tag">${a} 天後開課</span>`;
    return `<div class="card now ${cds.includes(today) ? 'today' : ''}" data-act="goto-session" data-id="${s.id}">
      <div class="top"><span>${when}</span>${statusTag(f)}</div>
      <h3>${esc(sessionTitle(s))}</h3>
      <div class="muted">${shortDate(startDate(s))} – ${shortDate(endDate(s))}　共 ${total} 堂${s.time ? '　' + esc(s.time) + '–' + endTime(s) : ''}</div>
      <div class="muted">📍 ${esc(s.location || '地點待補')}　👤 ${esc(s.instructor || '未指定')}</div>
      <div class="fill"><b>${f.n}</b> 人　<span class="muted">成班 ${f.min}／上限 ${f.cap}</span>${fillBar(f.n, f.min, f.cap)}</div></div>`;
  };
  let body = rel.map(card).join('');
  if (!body) {
    const next = sortSessions(db.sessions.filter(s => !hasEnded(s)))[0];
    body = `<div class="card empty" style="grid-column:1/-1">未來 7 天沒有開課${next ? `，下一個是 ${shortDate(startDate(next))} 開課的「${esc(sessionTitle(next))}」` : ''}</div>`;
  }
  return `<div class="section"><h3>現在開什麼課 <span class="muted">上課中，以及 7 天內開課</span></h3><div class="now-grid">${body}</div></div>`;
}

// 月曆：每個上課日顯示當天有哪些課，顏色代表課程，右上角圓點代表招生狀態
function calendarHTML() {
  const [Y, M] = ui.calMonth.split('-').map(Number);
  const first = new Date(Y, M - 1, 1);
  const gridStart = new Date(Y, M - 1, 1 - first.getDay());          // 從該月 1 號所在週的週日開始
  const weeks = Math.ceil((first.getDay() + new Date(Y, M, 0).getDate()) / 7);
  const today = ymd(new Date());

  // 日期 → 當天的課
  const byDay = {};
  db.sessions.forEach(s => (s.dates || []).forEach(d => (byDay[d.date] = byDay[d.date] || []).push({ s, off: d.off })));

  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
    const key = ymd(d);
    const items = (byDay[key] || []).sort((a, b) => (a.s.time || '').localeCompare(b.s.time || '')).map(({ s, off }) => {
      if (off) return `<div class="cal-item off" style="${courseColor(s.courseId)}" data-act="goto-session" data-id="${s.id}" title="${esc(sessionTitle(s))}（休課）">${esc(courseName(s.courseId))}<br>休課</div>`;
      const f = fillInfo(s), cds = classDates(s);
      const tip = `${sessionTitle(s)}\n第 ${cds.indexOf(key) + 1}/${cds.length} 堂${s.time ? '　' + s.time + '–' + endTime(s) : ''}\n${s.location || '地點待補'}\n已報 ${f.n} 人｜成班 ${f.min}｜上限 ${f.cap}\n${f.label}`;
      return `<div class="cal-item ${f.cls === 'past' ? 'past' : ''}" style="${courseColor(s.courseId)}" data-act="goto-session" data-id="${s.id}" title="${esc(tip)}">
        <i class="sdot ${f.cls}"></i>
        <b>${esc(courseName(s.courseId))}</b>${s.time ? ' ' + esc(s.time) : ''}<br>
        <span>第${cds.indexOf(key) + 1}/${cds.length}堂・${f.n}人（成班${f.min}）</span></div>`;
    }).join('');
    cells += `<div class="cal-cell ${d.getMonth() !== M - 1 ? 'other' : ''} ${key === today ? 'today' : ''}"><div class="cal-day">${d.getDate()}</div>${items}</div>`;
  }
  return `<div class="cal-head">
      <button class="sm" data-act="cal-prev">‹ 上個月</button>
      <b>${Y} 年 ${M} 月</b>
      <button class="sm" data-act="cal-next">下個月 ›</button>
      <button class="sm" data-act="cal-today">回到本月</button>
    </div>
    <div class="cal-scroll"><div class="cal">
      ${WEEK.map(w => `<div class="cal-wd">${w}</div>`).join('')}${cells}
    </div></div>`;
}

/* ---------- 畫面：匯入平台訂單 ---------- */
// 平台 Excel 的欄位：[內部名稱, 顯示名稱, 可能的欄位標題]
const IMP_FIELDS = [
  ['name', '學員姓名', ['姓名', '學員姓名', '購買人']],
  ['product', '商品名稱', ['商品名稱', '課程名稱', '商品']],
  ['paid', '實售金額', ['實售金額', '實付金額', '金額']],
  ['date', '訂單日期', ['兌換時間', '報名日期', '訂購時間', '下單時間']],
  ['phone', '手機', ['手機', '電話']],
  ['member', '會員 id', ['udn 會員 id', '會員 id', '(鯨魚)會員代號', '會員代號']],
  ['code', '商品編號', ['商品編號']],
  ['status', '取消標示欄', ['訂單狀態', '狀態', '是否取消', '取消狀態', '取消', '異動', '備註']]
];
// 平台原本就有的 16 個欄位；多出來的那一欄就是「取消標示」
const KNOWN_HEADERS = ['udn 會員 id', '(鯨魚)會員代號', '所屬館別', '姓名', '手機', '商品編號', '商品名稱', '來源', '商品售價', '優惠券折抵金額', '實售金額', '兌換時間', '導購代碼 affcode', '優惠代碼名稱', '優惠代碼', '線上/實體'];
const imp = { file: '', headers: [], rows: [], cols: {}, cancelText: '取消', ops: [], skipped: 0, unmatched: new Map(), error: '', done: '' };
const normText = s => String(s ?? '').replace(/\s+/g, ' ').trim();
const toNum = v => Number(String(v ?? '').replace(/[^\d.-]/g, '')) || 0;

function cellVal(row, col) {
  const v = col ? row[col] : '';
  return v instanceof Date ? ymd(v) : v;
}

function parseImport(buf, filename) {
  imp.error = ''; imp.done = ''; imp.file = filename;
  try {
    if (typeof XLSX === 'undefined') throw new Error('Excel 讀取元件沒有載入，請確認網路連線後重新整理');
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const sheetName = wb.SheetNames.find(n => !n.includes('對照')) || wb.SheetNames[0];
    const ws = wb.Sheets[sheetName];
    imp.headers = (XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' })[0] || []).map(String).filter(Boolean);
    imp.rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: true }).filter(r => Object.values(r).some(v => String(v).trim() !== ''));
    if (!imp.rows.length) throw new Error('檔案裡沒有資料');
    // 自動對應欄位
    imp.cols = {};
    IMP_FIELDS.forEach(([k, , cands]) => { imp.cols[k] = imp.headers.find(h => cands.includes(h)) || ''; });
    if (!imp.cols.status) imp.cols.status = imp.headers.find(h => !KNOWN_HEADERS.includes(h)) || '';
    analyzeImport();
  } catch (e) {
    imp.rows = []; imp.error = '讀取失敗：' + e.message;
  }
}

function findRegByKey(key) {
  return db.registrations.find(r => r.orderKey === key || (r.prevKeys || []).includes(key));
}

function analyzeImport() {
  const c = imp.cols;
  const ignored = new Set(db.settings.ignoredProducts || []);
  const names = s => [s.productName, ...(s.aliases || [])].filter(Boolean).map(normText);
  imp.unmatched = new Map();
  const byKey = new Map();
  imp.skipped = 0;

  for (const row of imp.rows) {
    const name = normText(cellVal(row, c.name)), product = normText(cellVal(row, c.product));
    if (!name || !product) continue;
    const s = db.sessions.find(x => names(x).includes(product));
    if (!s) { if (!ignored.has(product)) imp.unmatched.set(product, (imp.unmatched.get(product) || 0) + 1); continue; }
    const st = normText(cellVal(row, c.status));
    const cancel = !!st && (!imp.cancelText || st.includes(imp.cancelText));
    const key = [normText(cellVal(row, c.member)), name, normText(cellVal(row, c.code)) || product].join('|');
    const it = { name, s, key, cancel, paid: toNum(cellVal(row, c.paid)), phone: normText(cellVal(row, c.phone)), date: String(cellVal(row, c.date) || '').slice(0, 10) };
    const prev = byKey.get(key);
    if (!prev || (it.cancel && !prev.cancel)) byKey.set(key, it);   // 同一筆訂單同時出現時，取消優先
  }

  const ops = [];
  const cancels = [], adds = [];
  for (const it of byKey.values()) {
    const reg = findRegByKey(it.key);
    if (it.cancel) {
      if (reg && reg.status === 'cancelled') { imp.skipped++; continue; }
      cancels.push({ it, reg });
    } else {
      if (reg) { imp.skipped++; continue; }
      adds.push({ it });
    }
  }

  // 疑似更改：同一位學員、同一課程，一筆取消（在系統內有報名）+ 一筆新訂單到不同場次
  const free = {};   // 本次匯入會釋出／佔用的名額
  const used = new Set();
  for (const cn of cancels) {
    if (!cn.reg || cn.reg.status !== 'active') continue;
    const m = adds.find(a => !used.has(a) && a.it.name === cn.it.name && a.it.s.courseId === cn.it.s.courseId && a.it.s.id !== cn.reg.sessionId);
    if (m) {
      used.add(m); cn.used = true;
      ops.push({ type: 'change', reg: cn.reg, to: m.it, checked: true });
      free[cn.reg.sessionId] = (free[cn.reg.sessionId] || 0) + 1;
      free[m.it.s.id] = (free[m.it.s.id] || 0) - 1;
    }
  }
  for (const cn of cancels) {
    if (cn.used) continue;
    if (cn.reg && cn.reg.status === 'active') { ops.push({ type: 'cancel', reg: cn.reg, it: cn.it, checked: true }); free[cn.reg.sessionId] = (free[cn.reg.sessionId] || 0) + 1; }
    else if (!cn.reg) ops.push({ type: 'cancel-new', it: cn.it, checked: true });
    else imp.skipped++;
  }
  for (const a of adds) {
    if (used.has(a)) continue;
    const left = seatsLeft(a.it.s) + (free[a.it.s.id] || 0);
    const full = left <= 0;
    if (!full) free[a.it.s.id] = (free[a.it.s.id] || 0) - 1;
    ops.push({ type: 'add', it: a.it, checked: !full, full });
  }
  imp.ops = ops;
}

const OP_INFO = {
  add: ['新增報名', 'ok'], cancel: ['取消訂單', 'danger'], 'cancel-new': ['取消（系統內無原訂單）', 'danger'], change: ['更改場次', 'warn']
};
function opRow(op, i) {
  const [label, cls] = OP_INFO[op.type];
  let who, what, note = '';
  if (op.type === 'change') {
    who = op.reg.name; what = `${esc(sessionLabel(byId(db.sessions, op.reg.sessionId)))}<br>→ <b>${esc(sessionLabel(op.to.s))}</b>`;
    note = `金額 ${money(op.reg.paid)} → ${money(op.to.paid)}`;
  } else {
    who = op.it.name; what = esc(sessionLabel(op.it.s)); note = money(op.it.paid) + (op.it.date ? '　' + op.it.date : '');
    if (op.type === 'cancel-new') note += '　會建立一筆「已取消」紀錄';
    if (op.full) note += '　<span class="tag danger">名額已滿，預設不匯入</span>';
  }
  return `<tr><td><input type="checkbox" data-op="${i}" ${op.checked ? 'checked' : ''}></td>
    <td><span class="tag ${cls}">${label}</span></td><td>${esc(who)}</td><td>${what}</td><td class="muted">${note}</td></tr>`;
}

function impBody() {
  if (imp.done) return `<div class="card info-done">${imp.done}</div>` + (imp.rows.length ? '' : '');

  const sel = ([k, label]) => `<label>${label}<select data-imp="${k}"><option value="">（沒有這欄）</option>${options(imp.headers.map(h => [h, h]), imp.cols[k])}</select></label>`;
  const un = [...imp.unmatched];

  return `

    <h3>1. 確認欄位 <span class="muted">${esc(imp.file)}，共 ${imp.rows.length} 筆資料</span></h3>
    <div class="imp-cols">${IMP_FIELDS.map(sel).join('')}
      <label>哪些文字代表「取消」<input data-imp-cancel value="${esc(imp.cancelText)}" placeholder="例如：取消"></label></div>
  </div>
  ${un.length ? `<div class="card section"><h3>2. 這些商品還沒對應到場次</h3>
    <p class="muted">選好對應的場次後按「套用對應」，系統會記住，下次匯入就自動歸課。不是你管理的課（例如線上課）可選「略過」。</p>
    ${un.map(([p, n], i) => `<div class="unm"><div><b>${esc(p)}</b> <span class="muted">${n} 筆</span></div>
      <select data-unm="${i}"><option value="">（先不處理）</option>${sess.map(s => `<option value="${s.id}">${esc(sessionLabel(s))}</option>`).join('')}<option value="__ignore">略過，之後不再提醒</option></select></div>`).join('')}

    ${imp.ops.length ? `<div class="table-wrap"><table><tr><th></th><th>動作</th><th>學員</th><th>課程場次</th><th>內容</th></tr>${imp.ops.map(opRow).join('')}</table></div>
      <div class="actions"><button class="primary" data-act="imp-apply">套用勾選的項目</button></div>`

}

function viewImport() {
  return `<h2>匯入訂單</h2>
  <div class="card section">
    <p class="muted" style="margin-top:0">把平台下載的 Excel（含取消標示欄的那份也可以）拖進來或選擇檔案。系統會依「商品名稱」自動歸到場次，新訂單加入名單，標示取消的訂單會取消，同一位學員取消後改報其他場次會視為「更改場次」。套用前你可以逐筆檢查。檔案只在你的瀏覽器內處理，不會上傳。</p>
    <input type="file" id="imp-file" accept=".xlsx,.xls,.csv">
  </div>
  <div id="imp-body">${impBody()}</div>`;
}
const refreshImp = () => { const b = $('#imp-body'); if (b) b.innerHTML = impBody(); };

function applyImport() {
  const picked = imp.ops.filter(o => o.checked);
  if (!picked.length) return alert('沒有勾選任何項目');
  const now = new Date().toISOString();
  const when = it => (/^\d{4}-\d{2}-\d{2}/.test(it.date) ? new Date(it.date + 'T00:00').toISOString() : now);
  const newReg = (it, status) => ({ id: uid('r'), sessionId: it.s.id, name: it.name, phone: it.phone, email: '', paid: it.paid, status, createdAt: when(it), orderKey: it.key, orderDate: it.date, source: 'import' });
  let a = 0, c = 0, ch = 0;
  picked.forEach(op => {
    if (op.type === 'add') { db.registrations.push(newReg(op.it, 'active')); a++; log('報名', `（匯入）${op.it.name} 報名 ${sessionLabel(op.it.s)}，實收 ${money(op.it.paid)}`); }
    else if (op.type === 'cancel') { op.reg.status = 'cancelled'; op.reg.cancelledAt = now; c++; log('取消', `（匯入）${op.reg.name} 取消 ${sessionLabel(byId(db.sessions, op.reg.sessionId))}`); }
    else if (op.type === 'cancel-new') { const r = newReg(op.it, 'cancelled'); r.cancelledAt = now; db.registrations.push(r); c++; log('取消', `（匯入）${op.it.name} 取消 ${sessionLabel(op.it.s)}（系統內原本沒有這筆訂單）`); }
    else if (op.type === 'change') {
      const from = byId(db.sessions, op.reg.sessionId);
      op.reg.prevKeys = [...(op.reg.prevKeys || []), op.reg.orderKey].filter(Boolean);
      op.reg.orderKey = op.to.key; op.reg.sessionId = op.to.s.id; op.reg.paid = op.to.paid; op.reg.orderDate = op.to.date || op.reg.orderDate;
      ch++; log('換場次', `（匯入）${op.reg.name} 由「${sessionLabel(from)}」換到「${sessionLabel(op.to.s)}」`);
    }
  });
  commit();
  imp.rows = []; imp.ops = [];
  imp.done = `<h3>匯入完成 ✓</h3><p>新增報名 <b>${a}</b> 筆、取消 <b>${c}</b> 筆、更改場次 <b>${ch}</b> 筆。</p>
    <p><a href="#registrations">看報名名單</a>　<a href="#dashboard">回總覽</a></p>`;
  refreshImp();
}

/* 匯出目前篩選的名單（CSV，Excel 可直接開啟）*/
function exportRegs() {
  const rows = [['課程', '場次', '姓名', '手機', '訂單日期', '實付金額', '退費金額', '狀態']];
  filteredRegs().forEach(r => {
    const s = byId(db.sessions, r.sessionId);
    rows.push([s ? courseName(s.courseId) : '', s ? s.name : '', r.name, r.phone, r.orderDate || r.createdAt.slice(0, 10), r.paid, r.refundAmount || '', STATUS_TEXT[r.status]]);
  });
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: `名單-${ymd(new Date())}.csv` });
  a.click(); URL.revokeObjectURL(url);
}

const views = { dashboard: viewDashboard, courses: viewCourses, sessions: viewSessions, registrations: viewRegistrations, import: viewImport, logs: viewLogs, settings: viewSettings };
function render() {
  if (appState !== 'ready') { $('#view').innerHTML = authView(); return; }

window.addEventListener('hashchange', render);

/* ---------- 登入與雲端同步 ---------- */
function authView() {
  const box = body => `<div class="card login">${body}</div>`;
  if (appState === 'loading') return box('<p class="muted" style="margin:0">載入中…</p>');
  if (appState === 'error') return box(`<h2>連線失敗</h2><p class="muted">${esc(authMsg)}</p><button class="primary" data-act="retry">重試</button>`);
  if (appState === 'denied') return box(`<h2>沒有使用權限</h2><p>帳號 <b>${esc(Store.email)}</b> 還不在允許名單內。</p><p class="muted">請管理者把這個 Email 加入允許名單。</p><button data-act="logout">登出</button>`);
  return box(`<h2>登入課務管理系統</h2>
    <form id="login-form">
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
      ${authMsg ? `<p class="login-msg">${esc(authMsg)}</p>` : ''}
      <button class="primary" style="width:100%">登入</button>
    </form>`);
}

function applyInit(r) {
  if (r.needLogin) appState = 'login';
  else if (r.notMember) appState = 'denied';
  else { db = r.data; appState = 'ready'; }
  updateSync();
  render();
}
async function boot() {
  appState = 'loading'; render();
  try { applyInit(await Store.init()); }
  catch (e) { appState = 'error'; authMsg = e.message || String(e); updateSync(); render(); }
}

let syncState = 'saved', syncErr = '';
function updateSync(s, err) {
  if (s) { syncState = s; syncErr = err || ''; }
  const el = $('#sync');
  if (!el) return;
  if (Store.mode !== 'cloud') { el.innerHTML = '<span class="muted">本機模式：資料只存在這個瀏覽器</span>'; return; }
  if (appState !== 'ready') { el.innerHTML = ''; return; }
  const m = { saving: ['#d9822b', '儲存中…'], saved: ['#3a9a6b', '已同步'], error: ['#d6564f', '儲存失敗，稍後自動重試'], conflict: ['#d6564f', '其他設備剛更新了資料，你剛剛的修改沒有儲存'] }[syncState];
  el.innerHTML = `<span class="sdot-lg" style="background:${m[0]}"></span><span>${m[1]}</span>
    ${syncState === 'conflict' ? '<button class="sm primary" data-act="reload">重新載入最新資料</button>' : ''}
    <span class="muted">${esc(Store.email)}</span><button class="sm" data-act="logout">登出</button>`;
}
Store.onStatus = updateSync;

// 別台改了資料時自動更新：回到這個分頁時、以及每 20 秒檢查一次
async function syncCheck() {
  if (appState !== 'ready' || Store.mode !== 'cloud' || modal.open) return;
  try { const fresh = await Store.refresh(); if (fresh) { db = fresh; render(); } } catch (e) { /* 網路暫時失敗，下次再試 */ }
}
setInterval(syncCheck, 20000);
window.addEventListener('focus', syncCheck);
window.addEventListener('beforeunload', e => { if (Store.hasPending()) { e.preventDefault(); e.returnValue = ''; } });
const cloudNote = () => Store.mode === 'cloud' ? '\n\n注意：已連到雲端，所有設備的資料都會一起被改掉。' : '';

/* ---------- 事件（集中處理） ---------- */
function moveMonth(n) {
  const [y, m] = ui.calMonth.split('-').map(Number);
  ui.calMonth = ymdMonth(new Date(y, m - 1 + n, 1));
  $('#cal-wrap').innerHTML = calendarHTML();   // 只更新月曆，頁面不會跳動
}

const actions = {
  'course-add': () => courseForm(),
  'course-edit': id => courseForm(byId(db.courses, id)),
  'course-del': id => {
    const c = byId(db.courses, id);
    if (db.sessions.some(s => s.courseId === id)) return alert('這個課程還有場次，請先刪除場次');
    if (!confirm(`確定刪除課程「${c.name}」？`)) return;
    db.courses = db.courses.filter(x => x.id !== id); log('課程', `刪除課程：${c.name}`); commit(); render();
  },
  'session-add': id => sessionForm({}, id),
  'session-edit': id => sessionForm(byId(db.sessions, id)),
  'session-del': id => {
    const s = byId(db.sessions, id);
    if (activeRegs(id).length) return alert('這個場次還有學員報名中，請先辦理退費或換場次');
    if (!confirm(`確定刪除場次？\n${sessionLabel(s)}`)) return;
    db.registrations = db.registrations.filter(r => r.sessionId !== id);
    db.sessions = db.sessions.filter(x => x.id !== id);
    log('場次', `刪除場次：${sessionLabel(s)}`); commit(); render();
  },
  'goto-session': id => { ui.regSession = id; ui.regStatus = ''; ui.regQ = ''; location.hash = '#registrations'; },
  'logout': async () => { await Store.logout(); authMsg = ''; boot(); },
  'reload': () => location.reload(),
  'retry': () => boot(),
  'export-regs': () => exportRegs(),
  'imp-apply': () => applyImport(),
  'imp-map': () => {
    const keys = [...imp.unmatched.keys()];
    document.querySelectorAll('[data-unm]').forEach(sel => {
      const p = keys[+sel.dataset.unm], v = sel.value;
      if (!v) return;
      if (v === '__ignore') { (db.settings.ignoredProducts = db.settings.ignoredProducts || []).push(p); log('設定', `略過平台商品：${p}`); return; }
      const s = byId(db.sessions, v);
      if (!s.productName) s.productName = p; else (s.aliases = s.aliases || []).push(p);
      log('場次', `平台商品「${p}」對應到 ${sessionLabel(s)}`);
    });
    commit(); analyzeImport(); refreshImp();
  },
  'ign-clear': () => { db.settings.ignoredProducts = []; commit(); render(); },
  'cal-prev': () => moveMonth(-1),
  'cal-next': () => moveMonth(1),
  'cal-today': () => { ui.calMonth = ymdMonth(); $('#cal-wrap').innerHTML = calendarHTML(); },
  'reg-add': id => regForm(id),
  'reg-refund': id => refundForm(id),
  'reg-transfer': id => transferForm(id),
  'rule-add': () => $('#rules').insertAdjacentHTML('beforeend', ruleRow()),
  'rule-del': (_, el) => el.closest('.rule-row').remove(),
  'export': () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: `course-backup-${new Date().toISOString().slice(0, 10)}.json` });
    a.click(); URL.revokeObjectURL(url);
  },
  'import': () => $('#import-file').click(),
  'load-real': () => { if (confirm('會覆蓋現有資料，確定嗎？' + cloudNote())) { db = Store.initial(); commit(); render(); } },
  'load-sample': () => { if (confirm('會覆蓋現有資料，確定嗎？' + cloudNote())) { db = Store.sample(); commit(); render(); } },
  'clear-all': () => { if (confirm('會刪除全部資料且無法復原，確定嗎？' + cloudNote())) { db = Store.empty(); commit(); render(); } }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && actions[el.dataset.act]) actions[el.dataset.act](el.dataset.id, el);
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'imp-file' && t.files[0]) {
    const f = t.files[0], reader = new FileReader();
    reader.onload = () => { parseImport(reader.result, f.name); refreshImp(); };
    reader.readAsArrayBuffer(f);
  }
  if (t.dataset.imp) { imp.cols[t.dataset.imp] = t.value; analyzeImport(); refreshImp(); }
  if ('impCancel' in t.dataset) { imp.cancelText = t.value.trim(); analyzeImport(); refreshImp(); }
  if (t.dataset.op != null) imp.ops[+t.dataset.op].checked = t.checked;
  if (t.id === 'f-course') { ui.sessionCourse = t.value; render(); }
  if (t.id === 'f-session') { ui.regSession = t.value; $('#regList').innerHTML = regTable(); }
  if (t.id === 'f-status') { ui.regStatus = t.value; $('#regList').innerHTML = regTable(); }
  if (t.id === 'import-file' && t.files[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (!['courses', 'sessions', 'registrations'].every(k => Array.isArray(d[k]))) throw new Error('格式不符');
        db = Store.migrate(d); commit(); render(); alert('匯入成功');
      } catch (err) { alert('匯入失敗：' + err.message); }
    };
    reader.readAsText(t.files[0]);
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'f-q') { ui.regQ = e.target.value; $('#regList').innerHTML = regTable(); }
});

document.addEventListener('submit', async e => {
  if (e.target.id === 'login-form') {
    e.preventDefault();
    const f = new FormData(e.target);
    authMsg = '登入中…'; render();
    try { authMsg = ''; applyInit(await Store.login(f.get('email'), f.get('password'))); }
    catch (err) { appState = 'login'; authMsg = /Invalid login/i.test(err.message) ? 'Email 或密碼不正確' : '登入失敗：' + err.message; render(); }
    return;
  }
  if (e.target.id !== 'rules-form') return;
  e.preventDefault();
  const rows = [...e.target.querySelectorAll('.rule-row')].map(r => ({
    minDays: +$('[name=minDays]', r).value, percent: +$('[name=percent]', r).value
  }));
  if (!rows.length) return alert('至少要有一條規則');
  if (!rows.some(r => r.minDays === 0)) return alert('請至少設定一條「開課前 0 天」的規則，作為最後底線');
  db.settings.refundRules = rows.sort((a, b) => b.minDays - a.minDays);
  log('設定', '更新退費規則'); commit(); render(); alert('已儲存');
});

boot();

  </script>
</body>
</html>
